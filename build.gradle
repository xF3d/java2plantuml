plugins {
    id 'java'
    id("io.freefair.lombok") version "8.14"
}

group = 'com.deepmodel'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url = 'https://repo.gradle.org/gradle/libs-releases' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2' // Updated to latest 4.x

    // parsing
    implementation 'com.github.javaparser:javaparser-core:3.28.2'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'

    // UML
    implementation 'com.github.plantuml:plantuml:v1.2026.1'
    implementation 'org.apache.xmlgraphics:batik-swing:1.19'
    implementation 'org.knowm.xchart:xchart:3.9.0'

    // config
    implementation 'org.tomlj:tomlj:1.1.1'

    // AI
    implementation 'dev.langchain4j:langchain4j-ollama:1.18.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.18.0'
    implementation 'dev.langchain4j:langchain4j-http-client-jdk:1.18.0'

    // Build runner
    implementation 'org.apache.maven.shared:maven-invoker:3.3.0'
    implementation 'org.gradle:gradle-tooling-api:9.1.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
}

jar {
    manifest {
        attributes 'Main-Class': 'MainDriver'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}