plugins {
    id 'java'
    id("io.freefair.lombok") version "8.14"
}

group = 'com.deepmodel'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2' // Updated to latest 4.x

    // parsing
    implementation 'com.github.javaparser:javaparser-core:3.27.0'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.27.0'

    // UML
    implementation 'com.github.plantuml:plantuml:v1.2026.1'
    implementation 'org.apache.xmlgraphics:batik-swing:1.19'
    implementation 'org.knowm.xchart:xchart:3.9.0'

    // config
    implementation 'org.tomlj:tomlj:1.1.1'

    // AI
    implementation 'dev.langchain4j:langchain4j-ollama:1.18.0'
}

jar {
    manifest {
        attributes 'Main-Class': 'MainDriver'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/**'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}