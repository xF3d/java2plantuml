[translators]
allow_classes = true
allow_interfaces = true
allow_records = true
allow_enums = true
allow_annotations = true

[uml_translator]
show_methods = true
show_attributes = true
show_colored_access_specifiers = true
show_associations = true
package_whitelist = []
package_blacklist = []

[ai]
verify_with_main = true
validation_retries = 3

[build_runner]
mvn_path = ""

[[metric_definitions]]
metric = "CBO"
max = 13.0
min = 0.0
target = "LOWER"

